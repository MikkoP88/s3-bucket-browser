<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Bucket Browser</title>
  <script>
    // Pre-paint theme: the palettes live on [data-theme], so without this
    // the first frame renders with unset colors and flashes. Must stay in
    // sync with initTheme() in js/main.js: saved explicit choice, else the
    // system preference. Runs before the stylesheet — no visual flash.
    (function () {
      try {
        var t = localStorage.getItem('s3b-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage unavailable — initTheme() decides */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-file-drop-target>
  <div id="app" class="app">

    <!-- ============ Menu bar ============ ⁠​‌‌‌​​‌‌​​‌‌​​‌‌​‌‌​​​‌​​​‌​‌‌​‌​‌‌‌​​​​​‌‌‌​​‌​​‌‌​‌‌‌‌​‌‌‌​‌‌​​‌‌​​‌​‌​‌‌​‌‌‌​​‌‌​​​​‌​‌‌​‌‌‌​​‌‌​​​‌‌​‌‌​​‌​‌​​‌​‌‌​‌​‌‌‌​‌‌​​​‌‌​​​‌​​‌​​​​​​‌‌‌‌‌​​​​‌​​​​​​‌​​​​‌‌​‌‌​‌‌‌‌​‌‌‌​​​​​‌‌‌‌​​‌​‌‌‌​​‌​​‌‌​‌​​‌​‌‌​​‌‌‌​‌‌​‌​​​​‌‌‌​‌​​​​‌​​​​​​​‌​‌​​​​‌‌​​​‌‌​​‌​‌​​‌​​‌​​​​​​​‌‌​​‌​​​‌‌​​​​​​‌‌​​‌​​​‌‌​‌‌​​​‌​​​​​​‌​​‌‌​‌​‌‌​‌​​‌​‌‌​‌​‌‌​‌‌​‌​‌‌​‌‌​‌‌‌‌​​‌​​​​​​‌​‌​​​​​‌‌​​‌​‌​‌‌‌​​‌‌​‌‌​‌‌‌‌​‌‌​‌‌‌​​‌‌​​‌​‌​‌‌​‌‌‌​​​‌​​​​​​​‌​‌​​​​‌​​‌‌​‌​‌‌​‌​​‌​‌‌​‌​‌‌​‌‌​‌​‌‌​‌‌​‌‌‌‌​‌​‌​​​​​​‌‌‌​​​​​‌‌‌​​​​​‌​‌​​‌​​‌​​​​​​‌‌‌‌‌​​​​‌​​​​​​‌​‌​​​​​‌‌​‌‌‌‌​‌‌​‌‌​​​‌‌‌‌​​‌​‌​​​‌‌​​‌‌​‌‌‌‌​‌‌‌​​‌​​‌‌​‌‌​‌​​‌​​​​​​‌​​‌​​‌​‌‌​‌‌‌​​‌‌‌​‌​​​‌‌​​‌​‌​‌‌‌​​‌​​‌‌​‌‌‌​​‌‌​​​​‌​‌‌​‌‌​​​​‌​​​​​​‌​‌​‌​‌​‌‌‌​​‌‌​‌‌​​‌​‌​​‌​​​​​​‌​​‌‌​​​‌‌​‌​​‌​‌‌​​​‌‌​‌‌​​‌​‌​‌‌​‌‌‌​​‌‌‌​​‌‌​‌‌​​‌​‌​​‌​​​​​​​‌‌​​​‌​​‌​‌‌‌​​​‌‌​​​​​​‌​‌‌‌​​​‌‌​​​​​​‌​​​​​​‌‌‌‌‌​​​​‌​​​​​​‌‌​​‌‌‌​‌‌​‌​​‌​‌‌‌​‌​​​‌‌​‌​​​​‌‌‌​‌​‌​‌‌​​​‌​​​‌​‌‌‌​​‌‌​​​‌‌​‌‌​‌‌‌‌​‌‌​‌‌​‌​​‌​‌‌‌‌​‌​​‌‌​‌​‌‌​‌​​‌​‌‌​‌​‌‌​‌‌​‌​‌‌​‌‌​‌‌‌‌​‌​‌​​​​​​‌‌‌​​​​​‌‌‌​​​​​‌​‌‌‌‌​‌‌‌​​‌‌​​‌‌​​‌‌​​‌​‌‌​‌​‌‌​​​‌​​‌‌‌​‌​‌​‌‌​​​‌‌​‌‌​‌​‌‌​‌‌​​‌​‌​‌‌‌​‌​​​​‌​‌‌​‌​‌‌​​​‌​​‌‌‌​​‌​​‌‌​‌‌‌‌​‌‌‌​‌‌‌​‌‌‌​​‌‌​‌‌​​‌​‌​‌‌‌​​‌​⁠-->
    <div id="menubar"></div>

    <!-- ============ Global bar: app-scope controls ============ -->
    <!-- The buttons that act on the whole app — both panes at once — sit
         here, full width under the menubar: the Dual-pane toggle, Compare,
         the theme and the shortcut sheet. Each content pane's toolbar
         below keeps only what acts on that pane alone. -->
    <header class="toolbar gbar" id="gbar">
      <button class="tb-btn" id="btn-panes" title="Dual-pane: open or close the secondary pane — a remembered non-default view offers a Home / last-view picker (F9 plain-toggles)" aria-haspopup="menu">&#128193;&#8644;&#128193;<span class="tb-word"> Dual-pane</span></button>
      <button class="tb-btn" id="btn-compare" title="Compare the main view with the secondary pane" disabled>&#8644;<span class="tb-word"> Compare</span></button>
      <button class="tb-btn" id="btn-sync" title="Synchronize the two dual-pane sides with each other" disabled>&#10227;<span class="tb-word"> Synchronize</span></button>
      <span class="tb-spacer"></span>
      <button class="tb-btn" id="btn-theme" title="Light / dark theme">&#9681;</button>
      <button class="tb-btn" id="btn-help" title="Keyboard shortcuts (F1)">?</button>
    </header>

    <!-- ============ Main split: tree | main pane | optional secondary pane ============ -->
    <main class="main">
      <aside class="sidebar" id="sidebar" aria-label="Buckets">
        <div class="sidebar-head" id="sidebar-head">Buckets</div>
        <!-- tree-filter: the funnel's pattern strip (the label comes from i18n at boot) -->
        <div class="tree-filter hidden" id="tree-filter">
          <input id="tree-filter-input" class="input mono" spellcheck="false" autocomplete="off">
        </div>
        <div class="fav-section hidden" id="fav-section" aria-label="Favorites">
          <div class="fav-head">&#9733; Favorites</div>
          <div class="favorites" id="favorites" role="list"></div>
        </div>
        <div class="tree" id="tree" role="tree"></div>
        <!-- side footer: the Data Sources area's own status line, the sidebar's
             counterpart of the content size bar — the tree's row count (or the
             filter's shown count), and the source being scanned with a Stop
             control while a deep walk runs -->
        <div class="side-foot hidden" id="side-foot" role="status">
          <span class="sf-count" id="side-foot-count"></span>
          <button id="side-foot-stop" class="sf-stop hidden" type="button"></button>
        </div>
      </aside>
      <div class="side-split" id="side-split" title="Drag to resize — double-click to reset"></div>
      <!-- main pane column: the content area with its own toolbar and path
           bar — the stack the secondary pane's twin mirrors button for
           button -->
      <div class="pane-col" id="main-pane">
        <header class="toolbar" id="toolbar">
          <button class="tb-btn" id="btn-back" title="Back (Alt+Left)" disabled><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg></button>
          <button class="tb-btn" id="btn-forward" title="Forward (Alt+Right)" disabled><svg class="flip" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg></button>
          <button class="tb-btn" id="btn-refresh" title="Refresh (F5)">&#8635;</button>
          <!-- Home: the open data source's landing view (its bucket list
               or contents root, a remote's root) — the workstation home
               when a local folder owns the main view -->
          <button class="tb-btn" id="btn-home" title="Home (data source home)"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5ZM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5Z"/></svg></button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="btn-upload" title="Upload files and folders (Ctrl+U)">&#8682;<span class="tb-word"> Upload</span></button>
          <button class="tb-btn" id="btn-download" title="Download selection (Ctrl+D)">&#8681;<span class="tb-word"> Download</span></button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="btn-newfolder" title="New folder (Ctrl+Shift+N)">&#128193;+</button>
          <button class="tb-btn" id="btn-newfile" title="New file (Shift+F4)">&#128196;+</button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="btn-find" title="Search (Ctrl+Shift+F)">&#128269;<span class="tb-word"> Search</span></button>
          <span class="tb-sep"></span>
          <!-- Gallery: the tile face of the same listing — folder and
               file glyphs by type, live thumbnails for images (a
               bounded preview sliver, never a download), sharing the
               row selection and verbs. The secondary pane carries its own -->
          <button class="tb-btn" id="btn-gallery" title="Gallery view (tiles with image thumbnails)" aria-pressed="false">&#128444;</button>
        </header>

        <!-- ============ Nav bar: breadcrumb + filter ============ -->
        <nav class="navbar">
          <div id="breadcrumb" class="breadcrumb"></div>
          <input id="filter" class="filter" type="text" placeholder="Filter all columns (Ctrl+F)" spellcheck="false">
        </nav>
        <div class="grid-wrap" id="grid-wrap">
          <!-- connection banner: persistent not-connected / stale-content
               notice for the current view's source (rows stay; Reconnect
               heals) — the slim sibling of the empty-state error panel -->
          <div class="conn-banner hidden" id="conn-banner" role="alert">
            <span class="cb-dot" aria-hidden="true"></span>
            <span class="cb-text" id="conn-banner-text"></span>
            <button class="btn primary cb-act" id="conn-banner-act" type="button"></button>
            <button class="cb-x" id="conn-banner-x" type="button">&#215;</button>
          </div>
          <!-- compare banner: the strip that names the pair being
               compared — spinner while the wire is out, the verdict
               summary once it lands, Retry when it fails; X clears the
               decorations from both grids -->
          <div class="conn-banner cmp hidden" id="cmp-banner" role="status">
            <span class="cb-dot cmp-dot" aria-hidden="true"></span>
            <span class="cb-text" id="cmp-banner-text"></span>
            <button class="btn primary cb-act hidden" id="cmp-banner-retry" type="button">Retry</button>
            <button class="cb-x" id="cmp-banner-x" type="button">&#215;</button>
          </div>          <div class="grid-head" id="grid-head" role="row"></div>
          <div class="grid-body" id="grid-body" tabindex="0" role="listbox" aria-label="Objects">
            <!-- parent row: the WinSCP parent-directory entry as the first
                 row of the listing itself — the same folder glyph every
                 folder row wears, its corner carrying the backward
                 arrow that marks the climb, beside the ".." caption,
                 seated in the Name column exactly where a folder row's
                 own name sits
                 (main.js mirrors the grid's live column template onto
                 the button: an empty checkbox gutter, then the name
                 cell, so resize and reorder never break the seat); one
                 click up from any content view. Absent at a source's top
                 level — the Data source main view, a bucket-scoped
                 source's root (its home IS the bucket's contents) —
                 and while an information panel owns the area (loading,
                 errors, onboarding). It scrolls with the content inside
                 the grid body; never a grid row, so it cannot join
                 selection, counts or filters. Title from i18n at boot. -->
            <button class="upbar hidden" id="upbar" type="button">
              <span class="gc check" aria-hidden="true"></span>
              <span class="gc name">
                <span class="icon">&#128193;<svg class="up-arrow" viewBox="0 0 12 12" aria-hidden="true"><circle class="up-badge" cx="6" cy="6" r="5.4"/><path class="up-glyph" d="M6 9.4V3M3 6 6 3l3 3"/></svg></span>
                <span class="up-label">..</span>
              </span>
            </button>
            <div class="grid-canvas" id="grid-canvas"></div>
          </div>
          <!-- gallery: the tile face of the same listing — glyphs by
               type, live image thumbnails (a bounded PreviewData
               sliver, never a download), sharing the row model,
               selection and verbs; hidden while the rows own the
               view and covered by the same overlay panels (loading,
               errors, empty states) when they own the area -->
          <div class="gallery hidden" id="gallery" tabindex="0" role="listbox" aria-label="Gallery"></div>
          <div class="empty-state hidden" id="empty-state">
            <img class="empty-icon" src="assets/logo.svg" alt="">
            <div class="empty-title" id="empty-title"></div>
            <div class="empty-sub" id="empty-sub"></div>
            <div class="empty-actions" id="empty-actions"></div>
            <!-- in-flight state: animated placeholder rows standing in for
                 the listing that has not arrived yet — a blank panel reads
                 as "empty folder", this reads as "working on it" -->
            <div class="load-skel hidden" id="load-skel" aria-hidden="true">
              <div></div><div></div><div></div><div></div><div></div>
            </div>
          </div>
          <!-- content bottom bar: the active data source's name beside the
               real recursive totals of the listing or the selection —
               this source only, never cross-source (WinSCP-style) -->
          <div class="grid-status" id="grid-status" role="status"><span class="gs-src hidden" id="grid-source"></span><span class="gs-text" id="grid-status-text"></span></div>
        </div>
      </div>

      <!-- pane splitter: drag to rebalance the panes — the seat is a
           session-only share that scales with the window; double-click
           resets the even twins -->
      <div class="side-split pane-split hidden" id="pane-split" title="Drag to resize — double-click to reset"></div>

      <!-- Secondary pane (dual-pane, F9 or the toolbar toggle): a twin of
           the main content area — its own toolbar, path bar, grid and
           status — bound to the workstation filesystem or any configured
           source through source-pinned APIs. Opens empty (pick a source
           below) or via the tree's "Open on secondary pane"; the × or the
           toggle closes it, and the last location is remembered. -->
      <section class="local-pane hidden" id="local-pane" aria-label="Secondary pane">
        <header class="toolbar" id="local-toolbar">
          <button class="tb-btn" id="local-btn-back" title="Back" disabled><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg></button>
          <button class="tb-btn" id="local-btn-forward" title="Forward" disabled><svg class="flip" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg></button>
          <button class="tb-btn" id="local-btn-refresh" title="Refresh (F5)">&#8635;</button>
          <!-- Home: the Dual-pane picker's Home view as a toolbar button
               — a fresh start on the workstation home folder -->
          <button class="tb-btn" id="local-btn-home" title="Home (workstation home)"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5ZM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5Z"/></svg></button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="local-btn-upload" title="Upload files and folders to this pane">&#8682;<span class="tb-word"> Upload</span></button>
          <button class="tb-btn" id="local-btn-download" title="Download this pane's selection (Ctrl+D)">&#8681;<span class="tb-word"> Download</span></button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="local-btn-newfolder" title="New folder in this pane">&#128193;+</button>
          <button class="tb-btn" id="local-btn-newfile" title="New file in this pane">&#128196;+</button>
          <span class="tb-sep"></span>
          <button class="tb-btn" id="local-btn-find" title="Search this pane&#39;s content">&#128269;<span class="tb-word"> Search</span></button>
          <span class="tb-sep"></span>
          <!-- Gallery: the pane's own tile face over this pane's listing
               — the same glyphs, thumbnails and verbs (the toolbar
               family parity the panes owe the main view) -->
          <button class="tb-btn" id="local-btn-gallery" title="Gallery view (tiles with image thumbnails)" aria-pressed="false">&#128444;</button>
          <span class="tb-spacer"></span>
          <button class="tb-btn" id="local-btn-close" title="Close the secondary pane (F9)">&#215;</button>
        </header>
        <nav class="navbar">
          <!-- the pane's own path bar: interactive breadcrumb segments
               (click a segment to jump, click the empty tail to type a
               path) and the pane's own filter -->
          <div id="local-crumb" class="breadcrumb"></div>
          <input id="local-filter" class="filter" type="text" placeholder="Filter all columns (Ctrl+F)" spellcheck="false">
        </nav>
        <div class="grid-wrap" id="local-grid-wrap">
          <div class="grid-head" id="local-grid-head" role="row"></div>
          <div class="grid-body" id="local-grid-body" tabindex="0" role="listbox" aria-label="Secondary pane objects">
            <!-- parent row: the pane's own climb entry — same gate
                 (Settings → View), same top-level rules as the main
                 pane's -->
            <button class="upbar hidden" id="local-upbar" type="button">
              <span class="gc check" aria-hidden="true"></span>
              <span class="gc name">
                <span class="icon">&#128193;<svg class="up-arrow" viewBox="0 0 12 12" aria-hidden="true"><circle class="up-badge" cx="6" cy="6" r="5.4"/><path class="up-glyph" d="M6 9.4V3M3 6 6 3l3 3"/></svg></span>
                <span class="up-label">..</span>
              </span>
            </button>
            <div class="grid-canvas" id="local-grid-canvas"></div>
          </div>
          <!-- the pane's own gallery: the tile face of this pane's
               listing, sharing the pane rows model, selection and
               verbs; covered by the same pane overlays (empty state,
               load skeleton) -->
          <div class="gallery hidden" id="local-gallery" tabindex="0" role="listbox" aria-label="Secondary pane gallery"></div>
          <div class="empty-state hidden" id="local-empty">
            <img class="empty-icon" src="assets/logo.svg" alt="">
            <div class="empty-title" id="local-empty-title"></div>
            <div class="empty-sub" id="local-empty-sub"></div>
            <div class="empty-actions" id="local-empty-actions"></div>
            <!-- onboarding picker: the source the pane should bind to
                 (workstation filesystem included); hidden once a binding
                 exists — the tree's "Open on secondary pane" and the
                 remembered location take over -->
            <div class="empty-picker hidden" id="local-empty-picker">
              <select class="lp-src" id="local-src" title="Pane source: the workstation filesystem, or any configured source (S3, SFTP, FTP, WebDAV, local)"></select>
            </div>
            <div class="load-skel hidden" id="local-load-skel" aria-hidden="true">
              <div></div><div></div><div></div><div></div><div></div>
            </div>
          </div>
          <div class="grid-status" id="local-grid-status" role="status"><span class="gs-src hidden" id="local-source"></span><span class="gs-text" id="local-status"></span></div>
        </div>
      </section>
    </main>

    <!-- ============ Log drawer (optional, hidden by default) ============ -->
    <section class="logarea hidden" id="logarea"></section>

    <!-- ============ Status bar ============ -->
    <footer class="statusbar">
      <span id="status-selection">0 items</span>
      <span class="sb-spacer"></span>
      <span id="status-jobs" class="sb-jobs hidden"></span>
      <span id="status-tasks" class="sb-tasks hidden"></span>
      <span id="status-editing" class="sb-editing hidden" title="Files open in external editor — click to manage"></span>
      <span id="status-pfile" class="hidden" title="Open encrypted profile file"></span>
      <span class="sb-sep"></span>
      <span id="status-auto" class="sb-auto hidden" title="Auto refresh interval (View menu)"></span>
      <button class="sb-log" id="status-log" title="Toggle the log area (Ctrl+L)">Log</button>
      <span class="sb-sep"></span>
      <span id="status-version"></span>
    </footer>
  </div>

  <!-- Context menu -->
  <div class="ctxmenu hidden" id="ctxmenu"></div>
  <div class="pane-dest hidden" id="pane-dest" role="menu"></div>

  <!-- Popout root: floating non-modal windows (transfers, help views) -->
  <div id="popout-root"></div>

  <!-- Modal root -->
  <div class="modal-root hidden" id="modal-root"></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- Marquee selection rectangle -->
  <div class="marquee hidden" id="marquee"></div>

  <!-- File viewer: one file, one glance. Arrows walk the folder’s
       previewable files (images and text), Esc closes, a click on the
       image toggles actual size, and text seats a Wrap / Copy bar. -->
  <div id="viewer" class="hidden" role="dialog" aria-label="File preview">
    <div class="viewer-scrim" id="viewer-scrim"></div>
    <button class="viewer-nav viewer-prev" id="viewer-prev" aria-label="Previous file">&#8249;</button>
    <img id="viewer-img" alt="" draggable="false">
    <pre id="viewer-text"></pre>
    <button class="viewer-nav viewer-next" id="viewer-next" aria-label="Next file">&#8250;</button>
    <div class="viewer-bar">
      <span class="viewer-name" id="viewer-name"></span>
      <span class="viewer-meta" id="viewer-meta"></span>
      <button class="viewer-act" id="viewer-wrap" title="Toggle soft wrap">Wrap</button>
      <button class="viewer-act" id="viewer-copy" title="Copy the read text">Copy</button>
      <button class="viewer-close" id="viewer-close" aria-label="Close">&#10005;</button>
    </div>
  </div>

  <!-- Wails v3 runtime (an ES module — a classic script tag would die on its
       export statement and leave window.wails undefined, killing every
       binding call), then the v2-surface bridge; both load before main.js
       (module scripts execute in document order) so window.go/window.runtime
       exist when it runs. The harnesses install their own window.go first;
       js/bridge.js yields to it. -->
  <script type="module" src="/wails/runtime.js"></script>
  <script type="module" src="js/bridge.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
