<!-- S3 Bucket Browser brand mark: blue folder, gray back panel and
     tab, darker fold shadows (54x46 viewBox). Source of truth for every
     derived asset: PNG set via scripts/gen-icons.mjs, build/icon.ico and
     build/AppIcon.icns via tools/appicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 46">
  <title>S3 Bucket Browser</title>
  <!-- Gray back panel with tab: flat tab top, ONE straight hinge slope
       (the traced master carried pixel staircases here), beveled corners. -->
  <path fill="#666666" stroke="#666666" stroke-width="1" stroke-linejoin="round"
        d="M5 0.5 L24 0.5 L34 7 L51 7 L54 9 L54 42 L1 42 L1 3 Z"/>
  <!-- Blue front face: top edge tucks under the tab, folds down the
       parallel slope to the main edge; beveled top-right and spine. -->
  <path fill="#468fd2" stroke="#468fd2" stroke-width="1" stroke-linejoin="round"
        d="M1 4 L20 4 L29.2 10 L47 10 L47 11 L49 11 L51 14 L51 42 L50 42 L50 45 L1 45 Z"/>
  <clipPath id="face">
    <path d="M1 4 L20 4 L29.2 10 L47 10 L47 11 L49 11 L51 14 L51 42 L50 42 L50 45 L1 45 Z"/>
  </clipPath>
  <!-- Fold shadows: smooth curves, round caps - crease along the hinge
       (starting clear of the rounded corner), shade under the top edge
       and beside the spine. -->
  <g clip-path="url(#face)" fill="none" stroke="#547ea6" stroke-width="1.3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.4 4.6 Q24.6 7 27.7 8.7"/>
    <path d="M31.2 10.7 L46.2 10.7 Q48.4 10.9 49.3 12.6"/>
    <path d="M50.4 14.9 L50.4 41.7"/>
  </g>
</svg>