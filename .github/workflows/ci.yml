name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wails GUI packages (linked from ./cmd/s3b) need the webkit/GTK headers.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # docs/cli.md is generated (tools/gendocs); fail when it no longer
      # matches the command tree so help-text drift can't ship silently.
      - name: Docs freshness
        run: |
          go run ./tools/gendocs
          git diff --exit-code -- docs/cli.md || {
            echo "::error::docs/cli.md is stale — run: go run ./tools/gendocs"
            exit 1
          }

      - name: Test
        run: go test -race ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tags MUST be quoted: YAML flow mappings split at commas, and an
          # unquoted `desktop,production` once built with `-tags desktop`
          # only — which compiles Wails' stub frontend (internal/app/
          # app_default_unix.go) instead of the real GUI and hides every
          # production-only build failure. The `production` tag is what
          # selects Wails' real desktop frontend.
          # Linux GUI: cgo + webkit natively; ubuntu-latest (24.04) ships
          # webkit2gtk 4.1 only, so pass Wails' webkit2_41 tag. arm64 ships
          # as the headless CLI (-tags s3b_headless, no GTK deps).
          # darwin GUI needs Cocoa/WebKit: build on a macOS runner.
          - { os: ubuntu-latest, goos: linux, goarch: amd64, tags: "desktop,production,webkit2_41", artifact: s3b-linux-amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, tags: "s3b_headless", artifact: s3b-linux-arm64-cli }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, tags: "desktop,production", artifact: s3b-windows-amd64.exe }
          - { os: ubuntu-latest, goos: windows, goarch: arm64, tags: "desktop,production", artifact: s3b-windows-arm64.exe }
          - { os: macos-latest, goos: darwin, goarch: amd64, tags: "desktop,production", artifact: s3b-darwin-amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64, tags: "desktop,production", artifact: s3b-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build deps (linux GUI only)
        if: matrix.goos == 'linux' && matrix.tags != 's3b_headless'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: |
          # Windows builds embed publisher metadata (VERSIONINFO) via a
          # generated .syso; it must be removed afterwards so it can never
          # leak into another matrix job's (cross-arch) build.
          if [ "$GOOS" = "windows" ]; then
            GOOS= GOARCH= go run ./tools/versioninfo -version 0.0.0-ci -arch "$GOARCH"
          fi
          go build -ldflags "-s -w" $BUILD_TAGS -o dist/${{ matrix.artifact }} ./cmd/s3b
          rm -f cmd/s3b/*.syso
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TAGS: ${{ matrix.tags != '' && format('-tags {0}', matrix.tags) || '' }}
          # darwin cross-arch (amd64 on arm64 runners) disables cgo by
          # default, but Wails' darwin frontend is cgo — force it on. The
          # macOS 26 SDK also no longer auto-links UniformTypeIdentifiers
          # (WailsContext.m uses UTType), so link the framework explicitly.
          # Empty string elsewhere = unset = Go's native defaults.
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-framework UniformTypeIdentifiers' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  e2e-minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The e2e script builds the headless CLI (-tags s3b_headless), a
      # pure-Go build that needs no GUI headers.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -v /tmp/s3b-minio-data:/data \
            minio/minio:latest server /data
          bash scripts/wait-http.sh http://localhost:9000/minio/health/live

      - name: E2E against MinIO
        run: bash scripts/e2e-minio.sh

  # The NSIS installer is only packaged on releases; compile-check it on
  # every push so .nsi regressions surface in CI, not at tag time.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - name: Compile installer (with real cross-built payload)
        run: |
          mkdir -p dist
          go run ./tools/versioninfo -version 0.0.0-ci -arch amd64
          GOOS=windows GOARCH=amd64 go build -tags desktop,production -ldflags "-s -w" -o dist/s3b.exe ./cmd/s3b
          rm -f cmd/s3b/*.syso
          makensis -DVERSION=0.0.0-ci \
            -DPAYLOAD="$PWD/dist/s3b.exe" \
            -DOUT="$PWD/dist/s3b-setup-0.0.0-ci.exe" \
            scripts/installer/s3b.nsi
          test -f dist/s3b-setup-0.0.0-ci.exe
