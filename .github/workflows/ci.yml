name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wails GUI packages (linked from ./cmd/s3b) need the webkit/GTK headers.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GUI builds need cgo + webkit natively; arm64 ships as the
          # headless CLI (-tags s3b_headless, no GTK deps).
          - { os: ubuntu-latest, goos: linux, goarch: amd64, tags: "", artifact: s3b-linux-amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, tags: s3b_headless, artifact: s3b-linux-arm64-cli }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, artifact: s3b-windows-amd64.exe }
          - { os: ubuntu-latest, goos: windows, goarch: arm64, artifact: s3b-windows-arm64.exe }
          # darwin GUI needs Cocoa/WebKit: build on a macOS runner.
          - { os: macos-latest, goos: darwin, goarch: amd64, artifact: s3b-darwin-amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64, artifact: s3b-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build deps (linux GUI only)
        if: matrix.goos == 'linux' && matrix.tags == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build -ldflags "-s -w" $BUILD_TAGS -o dist/${{ matrix.artifact }} ./cmd/s3b
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TAGS: ${{ matrix.tags != '' && format('-tags {0}', matrix.tags) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  e2e-minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -v /tmp/s3b-minio-data:/data \
            minio/minio:latest server /data
          bash scripts/wait-http.sh http://localhost:9000/minio/health/live

      - name: E2E against MinIO
        run: bash scripts/e2e-minio.sh
