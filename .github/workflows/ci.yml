name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push/PR update cancels its in-flight run instead of
# burning a duplicate set of runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Wails GUI packages (linked from ./cmd/s3b) need the webkit/GTK headers.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet -tags gtk3 ./...

      # release.yml only runs on tags — lint every workflow here so a bad
      # edit can't wait silently for the next release to explode.
      - name: Workflow lint (actionlint)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          actionlint

      # docs/cli.md is generated (tools/gendocs); fail when it no longer
      # matches the command tree so help-text drift can't ship silently.
      - name: Docs freshness
        run: |
          go run ./tools/gendocs
          git diff --exit-code -- docs/cli.md || {
            echo "::error::docs/cli.md is stale — run: go run ./tools/gendocs"
            exit 1
          }

      # Vet/test need the gtk3 tag since the Wails v3 migration: bare
      # builds resolve Wails' default Linux frontend (gtk4/webkitgtk-6.0),
      # which the ubuntu image has never shipped — pkg-config fails before
      # any code is checked. The gtk3 tag selects webkit2gtk 4.1 (the
      # installed stack), same as the build matrix and release builds.
      - name: Test
        run: go test -race -tags gtk3 ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tags MUST be quoted: YAML flow mappings split at commas, and an
          # unquoted tag list once built with a single tag only, hiding
          # every production-only build failure. Wails v3 has no `desktop`
          # tag (the GUI is the default build); `production` strips
          # devtools. Linux GUI: Wails v3 defaults to GTK4/webkitgtk-6.0,
          # but the pinned ubuntu-24.04 image ships webkit2gtk 4.1 — pass the gtk3
          # tag against libgtk-3/libwebkit2gtk-4.1. arm64 GUI builds
          # natively on the arm64 runner (ubuntu-24.04-arm keeps the
          # webkit 4.1 stack aligned with the amd64 leg); the headless
          # CLI (-tags s3b_headless, no GTK deps) stays for servers.
          # darwin GUI needs Cocoa/WebKit: build on a macOS runner.
          - { os: ubuntu-24.04, goos: linux, goarch: amd64, tags: "production,gtk3", artifact: s3b-linux-amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, tags: "production,gtk3", artifact: s3b-linux-arm64 }
          - { os: ubuntu-24.04, goos: linux, goarch: arm64, tags: "s3b_headless", artifact: s3b-linux-arm64-cli }
          - { os: ubuntu-24.04, goos: windows, goarch: amd64, tags: "production", artifact: s3b-windows-amd64.exe }
          - { os: ubuntu-24.04, goos: windows, goarch: arm64, tags: "production", artifact: s3b-windows-arm64.exe }
          - { os: macos-latest, goos: darwin, goarch: amd64, tags: "production", artifact: s3b-darwin-amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64, tags: "production", artifact: s3b-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install GUI build deps (linux GUI only)
        if: matrix.goos == 'linux' && matrix.tags != 's3b_headless'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: |
          # Windows builds embed publisher metadata (VERSIONINFO) via a
          # generated .syso; it must be removed afterwards so it can never
          # leak into another matrix job's (cross-arch) build. env -u runs
          # the generator natively regardless of the matrix GOOS/GOARCH.
          if [ "$GOOS" = "windows" ]; then
            env -u GOOS -u GOARCH go run ./tools/versioninfo -version 0.0.0-ci -arch "$GOARCH"
          fi
          # BUILD_TAGS is "-tags a,b" (two words) or empty — split it so an
          # empty value adds no argument instead of an empty "" one.
          read -ra tags <<< "${BUILD_TAGS:-}"
          go build -ldflags "-s -w" "${tags[@]}" -o dist/${{ matrix.artifact }} ./cmd/s3b
          rm -f cmd/s3b/*.syso
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TAGS: ${{ matrix.tags != '' && format('-tags {0}', matrix.tags) || '' }}
          # macOS GUI uses cgo, also when building the other architecture.
          # Keep the deployment target aligned with scripts/build-macos.sh;
          # 13.0 accommodates both Go 1.26 and Go 1.27.
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '' }}
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=13.0' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=13.0 -framework UniformTypeIdentifiers' || '' }}

      # Verify the documented minimum in the actual Mach-O artifact.
      - name: Verify darwin minimum-system-version
        if: matrix.goos == 'darwin'
        run: |
          vtool -show-build "dist/${{ matrix.artifact }}"
          vtool -show-build "dist/${{ matrix.artifact }}" | grep -Eq "(minos|version) 13.0$" || {
            echo "::error::darwin binary minimum is not macOS 13.0 — the toolchain default leaked into the artifact"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  mac-local-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      # Exercise the documented local commands, not only raw go build.
      - name: Build local binary and app bundle
        run: |
          make build
          make mac
          bin/s3b version
          "dist/S3 Bucket Browser.app/Contents/MacOS/s3b" version
          codesign --verify --strict --verbose=2 "dist/S3 Bucket Browser.app"
      - name: Test on macOS
        run: make test

  e2e-minio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The e2e script builds the headless CLI (-tags s3b_headless), a
      # pure-Go build that needs no GUI headers.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # MinIO runs from the pinned GitHub-release server binary via
      # scripts/start-minio.sh — quay.io has refused ANONYMOUS pulls
      # outright since 24 Sep 2026 and the image registries have dropped
      # minio entirely (Docker Hub deleted minio/minio, bitnami froze at
      # 2019-era tags, dl.min.io binaries 410), but minio/minio's GitHub
      # releases still host the binaries: anonymous, pinned,
      # sha256-verified, served from the same infrastructure as this
      # runner. No quay account, no repo secrets, no docker.
      - name: Start MinIO
        run: bash scripts/start-minio.sh

      - name: E2E against MinIO
        run: bash scripts/e2e-minio.sh

  # Real OpenSSH (atmoz/sftp), vsftpd (fauria/vsftpd) and rclone/WebDAV
  # containers: the remote engines' handshakes, auth success/failure, PASV
  # data connections and PROPFIND plumbing, exercised through
  # `s3b source test` (M9) and the transfer matrix.
  # Images digest-pinned (resolved from :latest, 2026-09-29): anonymous
  # pulls keep working, :latest drift does not. Bump deliberately.
  e2e-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Start SFTP + FTP + WebDAV servers
        run: |
          # The trailing :upload field gives e2e a writable /home/e2e/upload
          # inside the chroot (the transfer matrix writes there).
          docker run -d --name sftp -p 2222:22 atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 e2e:e2epass:1001:100:upload
          # PASV_ADDRESS + mapped passive port range make PASV data
          # connections work through Docker NAT.
          # REVERSE_LOOKUP_ENABLE=NO: vsftpd's reverse-DNS of the client IP
          # otherwise stalls every fresh control connection ~15s before the
          # greeting.
          docker run -d --name ftp -p 2121:21 -p 21000-21002:21000-21002 \
            -e FTP_USER=e2e -e FTP_PASS=e2epass -e PASV_ADDRESS=127.0.0.1 \
            -e PASV_MIN_PORT=21000 -e PASV_MAX_PORT=21002 \
            -e REVERSE_LOOKUP_ENABLE=NO fauria/vsftpd@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
          # rclone serve webdav twice: once at the root, once under the
          # /dav baseurl prefix (the anchored-root contract).
          docker run -d --name webdav -p 7070:80 rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5 \
            serve webdav --addr :80 --user e2e --pass e2epass /srv
          docker run -d --name webdav-dav -p 7071:80 rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5 \
            serve webdav --addr :80 --user e2e --pass e2epass --baseurl /dav /srv

      - name: E2E remote engines
        run: bash scripts/e2e-remote.sh

  # Cross-source structure fidelity: every local/s3/sftp/ftp/webdav pairing
  # must reproduce the exact source tree at the destination (tree-diff per
  # cell + byte round-trips), plus the version-preservation contract
  # (cp --versions timelines, plain-cp collapse, mv --versions purge).
  # Hetzner cells stay env-gated (S3B_HETZNER_*) and skip in CI by default.
  e2e-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # MinIO from the pinned GitHub-release binary (scripts/start-minio.sh
      # — quay.io anonymous pulls are refused since 24 Sep 2026; the
      # e2e-minio job carries the full story); the remote fixtures stay on
      # Docker Hub, digest-pinned (resolved from :latest, 2026-09-29) —
      # anonymous pulls keep working, :latest drift does not.
      - name: Start MinIO + SFTP + FTP + WebDAV servers
        run: |
          bash scripts/start-minio.sh
          docker run -d --name sftp -p 2222:22 atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 e2e:e2epass:1001:100:upload
          # REVERSE_LOOKUP_ENABLE=NO: vsftpd's reverse-DNS of the client IP
          # otherwise stalls every fresh control connection ~15s before the
          # greeting.
          docker run -d --name ftp -p 2121:21 -p 21000-21002:21000-21002 \
            -e FTP_USER=e2e -e FTP_PASS=e2epass -e PASV_ADDRESS=127.0.0.1 \
            -e PASV_MIN_PORT=21000 -e PASV_MAX_PORT=21002 \
            -e REVERSE_LOOKUP_ENABLE=NO fauria/vsftpd@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
          docker run -d --name webdav -p 7070:80 rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5 \
            serve webdav --addr :80 --user e2e --pass e2epass /srv

      - name: E2E cross-source transfers
        run: bash scripts/e2e-cross.sh

  # The NSIS installer is only packaged on releases; compile-check it on
  # every push so .nsi regressions surface in CI, not at tag time.
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
      - name: Compile installer (with real cross-built payload)
        run: |
          mkdir -p dist
          go run ./tools/versioninfo -version 0.0.0-ci -arch amd64
          GOOS=windows GOARCH=amd64 go build -tags production -ldflags "-s -w" -o dist/s3b.exe ./cmd/s3b
          rm -f cmd/s3b/*.syso
          makensis -DVERSION=0.0.0-ci \
            -DPAYLOAD="$PWD/dist/s3b.exe" \
            -DOUT="$PWD/dist/s3b-setup-0.0.0-ci.exe" \
            scripts/installer/s3b.nsi
          test -f dist/s3b-setup-0.0.0-ci.exe

  # GUI visual harness: serves frontend/ with a Wails-API shim and walks
  # every surface with a real browser (screenshots + assertions). The
  # ubuntu image ships Chrome stable; the harness itself falls back across
  # channels if the image changes.
  gui-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Run visual harness
        run: |
          npm ci
          node scripts/gui-visual.mjs
        env:
          S3B_BROWSER_CHANNEL: chrome
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-visual-artifacts
          path: testartifacts/gui/
