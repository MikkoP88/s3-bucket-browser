name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # amd64 ships the full GUI: needs the webkit/GTK headers (same as CI).
      # gtk3: Wails v3 defaults to GTK4/webkitgtk-6.0, but ubuntu-latest
      # (24.04) ships webkit2gtk 4.1 — the gtk3 tag builds against that.
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build linux-amd64 (GUI) tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg
          go build -tags production,gtk3 -ldflags "-s -w -X main.version=${VERSION}" -o dist/pkg/s3b ./cmd/s3b
          cp LICENSE README.md dist/pkg/
          tar -C dist/pkg -czf "dist/s3b-${VERSION}-linux-amd64.tar.gz" s3b LICENSE README.md
        env:
          GOOS: linux
          GOARCH: amd64

      # arm64 ships as the headless CLI (-tags s3b_headless), like CI.
      - name: Build linux-arm64 (headless CLI) tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg-arm
          go build -tags s3b_headless -ldflags "-s -w -X main.version=${VERSION}" -o dist/pkg-arm/s3b ./cmd/s3b
          cp LICENSE README.md dist/pkg-arm/
          tar -C dist/pkg-arm -czf "dist/s3b-${VERSION}-linux-arm64-cli.tar.gz" s3b LICENSE README.md
        env:
          GOOS: linux
          GOARCH: arm64

      # Portable editions: the s3b-portable marker has
      # redirected config beside the binary since M5 — the release job just
      # bundles binary + LICENSE + NOTICE + marker + README-portable.md.
      # NOTICE is generated from go.mod so versions are always current.
      - name: Build linux portable tarballs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/gen-notice.sh "$VERSION" > NOTICE
          mkdir -p dist/port dist/port-arm
          cp dist/pkg/s3b LICENSE NOTICE README-portable.md dist/port/
          touch dist/port/s3b-portable
          tar -C dist/port -czf "dist/s3b-${VERSION}-linux-amd64-portable.tar.gz" s3b LICENSE NOTICE README-portable.md s3b-portable
          cp dist/pkg-arm/s3b LICENSE NOTICE README-portable.md dist/port-arm/
          touch dist/port-arm/s3b-portable
          tar -C dist/port-arm -czf "dist/s3b-${VERSION}-linux-arm64-cli-portable.tar.gz" s3b LICENSE NOTICE README-portable.md s3b-portable

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz

  windows:
    runs-on: ubuntu-latest
    env:
      # Optional Windows code signing: base64-encoded PFX + its password
      # (repo secrets WINDOWS_CERT_B64 / WINDOWS_CERT_PASS). Unset → the
      # signing steps are skipped and artifacts ship unsigned, as before.
      WINDOWS_CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
      WINDOWS_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Windows builds embed publisher metadata (VERSIONINFO) through a
      # generated .syso that must match the target arch and be removed
      # after the build (tools/versioninfo). Binaries are built first and
      # zipped AFTER the optional signing pass, so every artifact (zip,
      # portable zip, NSIS installer) carries the signed bytes.
      - name: Build windows-amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg dist/pkg-arm
          env -u GOOS -u GOARCH go run ./tools/versioninfo -version "${VERSION}" -arch amd64
          go build -tags production -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" -o dist/pkg/s3b.exe ./cmd/s3b
          rm -f cmd/s3b/*.syso
          cp LICENSE README.md dist/pkg/
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Build windows-arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          env -u GOOS -u GOARCH go run ./tools/versioninfo -version "${VERSION}" -arch arm64
          go build -tags production -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" -o dist/pkg-arm/s3b.exe ./cmd/s3b
          rm -f cmd/s3b/*.syso
          cp LICENSE README.md dist/pkg-arm/
        env:
          GOOS: windows
          GOARCH: arm64

      # Signing is secrets-gated: without a configured certificate the step
      # is skipped entirely (unsigned build); with one, a rejected cert or
      # unreachable timestamp fails the release rather than shipping mixed
      # artifacts.
      - name: Code-sign binaries
        if: env.WINDOWS_CERT_B64 != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
          printf '%s' "$WINDOWS_CERT_B64" | base64 -d > cert.pfx
          S3B_CERT_PFX="$PWD/cert.pfx" S3B_CERT_PASS="$WINDOWS_CERT_PASS" \
            bash scripts/sign-windows.sh dist/pkg/s3b.exe dist/pkg-arm/s3b.exe
          rm -f cert.pfx

      - name: Package windows zips
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist/pkg && zip -q "../s3b-${VERSION}-windows-amd64.zip" -- *)
          (cd dist/pkg-arm && zip -q "../s3b-${VERSION}-windows-arm64.zip" -- *)
          bash scripts/gen-notice.sh "$VERSION" > NOTICE
          mkdir -p dist/port dist/port-arm
          cp dist/pkg/s3b.exe LICENSE NOTICE README-portable.md dist/port/
          touch dist/port/s3b-portable
          (cd dist/port && zip -q "../s3b-${VERSION}-windows-amd64-portable.zip" -- *)
          cp dist/pkg-arm/s3b.exe LICENSE NOTICE README-portable.md dist/port-arm/
          touch dist/port-arm/s3b-portable
          (cd dist/port-arm && zip -q "../s3b-${VERSION}-windows-arm64-portable.zip" -- *)
          cp dist/pkg/s3b.exe dist/  # staging for the NSIS installer

      - name: Build NSIS installer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          VER="${GITHUB_REF_NAME#v}"
          makensis -DVERSION="$VER" \
            -DPAYLOAD="$PWD/dist/s3b.exe" \
            -DOUT="$PWD/dist/s3b-setup-$VER.exe" \
            scripts/installer/s3b.nsi

      # The installer itself gets its own signature (it embeds the already
      # signed s3b.exe); SmartScreen weighs the outermost signature.
      - name: Code-sign installer
        if: env.WINDOWS_CERT_B64 != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
          printf '%s' "$WINDOWS_CERT_B64" | base64 -d > cert.pfx
          S3B_CERT_PFX="$PWD/cert.pfx" S3B_CERT_PASS="$WINDOWS_CERT_PASS" \
            bash scripts/sign-windows.sh dist/s3b-setup-*.exe
          rm -f cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/s3b-setup-*.exe

  darwin:
    # No portable variant: the dmg/.app is the macOS distribution idiom —
    # a bare binary + marker is not. Portable mode itself still works there
    # if a user drops a s3b-portable marker next to the binary.
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: macos-latest
    env:
      # Minimum macOS the artifacts support — must not be below Go's own
      # floor (Go 1.26 darwin binaries target macOS 12; the runtime needs
      # 12+ syscalls) and must match README and docs. beta.13 and earlier
      # shipped minos 26.0 because the Xcode 26 clang defaults the
      # deployment target to the SDK version when nothing pins it, so
      # every Mac below macOS 26 refused to launch the app ("This version
      # cannot be used with this version of macOS"). Pin it explicitly —
      # clang's default is whatever the runner image of the day says.
      MACOS_MIN: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # The frontend is embedded, so go build with Wails' tags suffices
      # (no wails CLI toolchain); hand-roll a minimal .app bundle.
      # CGO_ENABLED: Wails' darwin frontend is cgo and cross-arch builds
      # (amd64 on arm64 runners) disable it by default. CGO_CFLAGS /
      # CGO_LDFLAGS: pin the deployment target for BOTH the cgo compile
      # and the external link (-mmacosx-version-min reaches clang either
      # way; MACOSX_DEPLOYMENT_TARGET alone is not honored at link time).
      # The macOS 26 SDK also no longer auto-links UniformTypeIdentifiers,
      # which Wails' UTType usage needs.
      - name: Build app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/S3 Bucket Browser.app"
          mkdir -p "$APP/Contents/MacOS"
          go build -tags production -ldflags "-s -w -X main.version=${VERSION}" -o "$APP/Contents/MacOS/s3b" ./cmd/s3b
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__MINOS__/${MACOS_MIN}/g" \
            scripts/installer/Info.plist > "$APP/Contents/Info.plist"
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-mmacosx-version-min=${{ env.MACOS_MIN }}"
          CGO_LDFLAGS: "-mmacosx-version-min=${{ env.MACOS_MIN }} -framework UniformTypeIdentifiers"
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      # Sign the bundle BEFORE packaging so the dmg carries the signed
      # app, then notarize + staple the dmg itself. Secrets-gated like
      # the Windows signing: without MACOS_CERT_B64 the bundle gets an
      # ad-hoc signature (launchable after the quarantine step README
      # documents — an unsigned bundle is what macOS Sequoia calls a
      # "damaged" app); with the secret, Developer ID signing and
      # notarization must succeed or the release fails.
      - name: Sign bundle and package dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/S3 Bucket Browser.app"
          DMG="dist/s3b-${VERSION}-darwin-${{ matrix.goarch }}.dmg"
          bash scripts/sign-macos.sh app "$APP"
          hdiutil create -volname "S3 Bucket Browser" -srcfolder "$APP" -ov -format UDZO "$DMG"
          bash scripts/sign-macos.sh dmg "$DMG"
        env:
          MACOS_CERT_B64: ${{ secrets.MACOS_CERT_B64 }}
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Gate: never again ship an artifact whose binary enforces a
      # different minimum than we document. vtool prints the Mach-O
      # version load command (minos X.Y for LC_BUILD_VERSION, version X.Y
      # for the legacy LC_VERSION_MIN_MACOSX).
      - name: Verify minimum-system-version gate
        run: |
          APP="dist/S3 Bucket Browser.app"
          echo "--- vtool -show-build (${{ matrix.goarch }}) ---"
          vtool -show-build "$APP/Contents/MacOS/s3b"
          vtool -show-build "$APP/Contents/MacOS/s3b" | grep -Eq "(minos|version) ${MACOS_MIN}$" || {
            echo "::error::binary minimum is not macOS ${MACOS_MIN} — the toolchain default leaked into the artifact"
            exit 1
          }
          PLIST_MIN="$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"
          echo "--- Info.plist LSMinimumSystemVersion: ${PLIST_MIN} ---"
          test "$PLIST_MIN" = "$MACOS_MIN" || {
            echo "::error::Info.plist LSMinimumSystemVersion is ${PLIST_MIN}, expected ${MACOS_MIN}"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.goarch }}
          path: dist/*.dmg

  # Supply-chain metadata for the release: full dependency graph plus an
  # SBOM (docs/security.md).
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Dependency report
        run: |
          mkdir -p dist
          go mod graph > dist/s3b-dependencies.txt

      - name: SBOM (syft, SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: release-sbom

      - uses: actions/upload-artifact@v4
        with:
          name: release-dependencies
          path: dist/s3b-dependencies.txt

  release:
    needs: [linux, windows, darwin, sbom]
    runs-on: ubuntu-latest
    steps:
      # The verification report is committed under docs/verification/; the
      # gate below reads it from the tagged tree.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      # No report, no release: the tag must carry a green, full-matrix
      # verification report. It is produced on the release machine by
      # `node scripts/verify.mjs --release <tag>` and committed before
      # tagging (CONTRIBUTING.md, "Cutting a release"; docs/VERIFICATION.md).
      - name: Verification gate
        run: |
          TAG="${GITHUB_REF_NAME}"
          J="docs/verification/${TAG}/verification.json"
          if [ ! -f "$J" ]; then
            echo "::error::No verification report at docs/verification/${TAG}/ — run 'node scripts/verify.mjs --release ${TAG}' on the tagged commit and commit the report first (CONTRIBUTING.md, Cutting a release)."
            exit 1
          fi
          if [ "$(jq -r '.category' "$J")" != "all" ]; then
            echo "::error::Report for ${TAG} is not a full-matrix run (category=$(jq -r '.category' "$J"))."
            exit 1
          fi
          FAILS=$(jq -r '.summary.fail' "$J")
          if [ "$FAILS" != "0" ]; then
            echo "::error::Verification report for ${TAG} has ${FAILS} FAIL row(s) — re-run the gate on a green tree."
            exit 1
          fi
          PASS=$(jq -r '.summary.pass' "$J")
          SKIP=$(jq -r '.summary.skip' "$J")
          REPORT_OS=$(jq -r '.os' "$J")
          {
            echo "VERIFIED=${PASS} PASS / ${SKIP} SKIP / 0 FAIL on ${REPORT_OS}"
            echo "REPORT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${TAG}/docs/verification/${TAG}"
          } >> "$GITHUB_ENV"
          echo "verification report for ${TAG}: ${PASS} PASS / ${SKIP} SKIP / 0 FAIL (${REPORT_OS})"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(printf '## Verification\n\n[Verification report for %s](%s) — the full action-verification gate ran on the tagged commit: %s.' "$TAG" "$REPORT_URL" "$VERIFIED")
          # Idempotent: create the release, or — if it already exists
          # (re-pushed/moved tag) — refresh its assets in place.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" \
              --title "s3b $TAG" --generate-notes --notes "$NOTES"
          fi
