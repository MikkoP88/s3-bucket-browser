# vsftpd conf for the e2e FTPS fixture — the fauria image's virtual-user
# law plus explicit TLS (AUTH TLS + PROT P) over the e2e-tls identity.
# The container entrypoint appends pasv_* lines from env and runs this.
background=NO
listen=YES
listen_port=21

anonymous_enable=NO
local_enable=YES
write_enable=YES
guest_enable=YES
virtual_use_local_privs=YES
pam_service_name=vsftpd_virtual
user_sub_token=$USER
local_root=/home/vsftpd/$USER
chroot_local_user=YES
allow_writeable_chroot=YES
hide_ids=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log
port_enable=YES
connect_from_port_20=YES
ftp_data_port=20
seccomp_sandbox=NO

# FTPS: explicit AUTH TLS on the control channel, PROT P data.
ssl_enable=YES
rsa_cert_file=/certs/cert.pem
rsa_private_key_file=/certs/key.pem
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
ssl_sslv2=NO
ssl_sslv3=NO
